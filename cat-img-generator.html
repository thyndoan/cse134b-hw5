<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thy Doan's cat generator" />
    <meta name="keywords" content="HTML" />
    <title>Thy Doan - cat pictures generator</title>
    <link rel="icon" type="image/png" href="imgs/kitty.png" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/site.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/form.css" />
    <script src="js/index.js" defer></script>
    <script src="js/cat-img-generator.js" defer></script>
    <!--Add inline script to avoid the "flash"-->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme == "light" || theme == "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header>
      <img
        id="logo"
        src="imgs/sunflower.png"
        alt="A cool sunflower wearing sun glasses logo"
        width="20"
        height="20"
      /><a href="index.html">Thy Doan</a>
    </header>

    <nav>
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cat-img-generator.html">Cat Images</a></li>
      </ul>
    </nav>

    <aside>
      <noscript>
        <p>
          JavaScript is disabled in your browser. Some features may not work
          (Theme picker requires Javascript), but all content on this site works
          without it, and you are seeing a system theme.
        </p>
      </noscript>

      <form class="theme-picker" aria-label="Theme selection">
        <fieldset>
          <legend>Theme</legend>
          <label>
            <input type="radio" name="theme" value="light" /> Light
          </label>
          <label> <input type="radio" name="theme" value="dark" /> Dark </label>
          <label
            ><input type="radio" name="theme" value="auto" /> System
            (auto)</label
          >
        </fieldset>
      </form>
    </aside>

    <main>
      <section class="intro">
        <h1>Cat Picture generator</h1>
      </section>

      <cat-widget count="3">
        <figure class="fallback">
          <img
            src="imgs/cute-cat-sleeping.jpg"
            alt="A sleeping tabby cat, since JavaScript is unavailable"
            width="300"
          />
          <figcaption>
            Live cat pictures require JavaScript. But here is one cute cat
            picture for you
          </figcaption>
        </figure>
        <ul class="cat-list" hidden></ul>
        <template id="cat-item-template">
          <li>
            <img src="" alt="A random cat" />
          </li> </template
      ></cat-widget>
    </main>

    <footer>
      <p>This page was made with &hearts; by Thy Doan - &copy; 2026</p>
    </footer>
  </body>
</html>
